name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    # SQL Server efímero para la comprobación de humo de la imagen. La
    # aplicación aplica migraciones al arrancar, así que sin una base de datos
    # real no llega ni a servir la primera página: probarla contra un servidor
    # inexistente no comprueba nada.
    #
    # La contraseña está en claro a propósito: es un contenedor que vive lo que
    # dura el trabajo, sin datos y sin puerto expuesto fuera del ejecutor.
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: 'Integracion.2026!'
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >-
          --health-cmd "timeout 2 bash -c '</dev/tcp/localhost/1433'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
          --health-start-period 20s

    steps:
      - uses: actions/checkout@v7

      - name: Install .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore LegacyLens.slnx

      - name: Build
        run: dotnet build LegacyLens.slnx --no-restore --configuration Release

      # Los tests cubren el analizador, que es la parte determinista del
      # sistema y por tanto la única que se puede verificar con asserts.
      - name: Test
        run: dotnet test LegacyLens.slnx --no-build --configuration Release --verbosity normal

      - name: Validate the container
        run: docker build -t legacylens:ci .

      # Que la imagen se construya y responda 200 no basta: una aplicación de
      # Blazor Server a la que le falte wwwroot/_framework arranca, sirve el HTML
      # y parece correcta, pero no tiene runtime en el navegador y ningún botón
      # funciona. Pasó de verdad, por publicar con --no-restore, y tardó en
      # detectarse porque todas las comprobaciones anteriores daban verde.
      - name: Check the image boots, migrates and serves Blazor
        run: |
          # --network host para que el contenedor alcance el servicio de SQL
          # Server en localhost del ejecutor.
          docker run -d --name humo --network host \
            -e 'ASPNETCORE_HTTP_PORTS=8080' \
            -e 'ConnectionStrings__DefaultConnection=Server=localhost,1433;Database=LegacyLensCi;User Id=sa;Password=Integracion.2026!;TrustServerCertificate=True;Encrypt=True' \
            legacylens:ci

          for attempt in $(seq 1 40); do
            if curl -sf -o /dev/null http://localhost:8080/; then
              echo "La aplicación responde tras $attempt intento(s)."
              break
            fi
            if [ "$attempt" -eq 40 ]; then
              echo '::error::La imagen no llegó a servir la página de inicio.'
              docker logs humo | tail -40
              docker rm -f humo
              exit 1
            fi
            sleep 3
          done

          # Que responda no basta. A una aplicación de Blazor Server sin
          # wwwroot/_framework le falta el runtime del navegador: sirve el HTML,
          # parece correcta y ningún botón funciona. Pasó de verdad, por publicar
          # con --no-restore, y ninguna comprobación anterior lo detectó.
          if ! curl -sf -o /dev/null http://localhost:8080/_framework/blazor.web.js; then
            echo '::error::La imagen no sirve _framework/blazor.web.js: el publish no incluyó los activos del framework.'
            docker logs humo | tail -40
            docker rm -f humo
            exit 1
          fi

          # Si ha respondido es que las migraciones se aplicaron: la aplicación
          # las ejecuta antes de empezar a servir.
          echo 'Arranque, migración y runtime de Blazor verificados.'
          docker rm -f humo

  terraform:
    name: Validate infrastructure
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.7.5

      - name: Check formatting
        run: terraform fmt -check -recursive
        working-directory: Deploy/infra

      # init sin backend: valida la sintaxis sin necesitar credenciales.
      # Mismo reintento que en la accion de despliegue: el init consulta el
      # registro de proveedores y un corte de red ahi no es un fallo del codigo.
      - name: Initialise
        working-directory: Deploy/infra
        run: |
          for attempt in 1 2 3; do
            if terraform init -backend=false; then exit 0; fi
            espera=$((attempt * 15))
            echo "El intento $attempt de terraform init ha fallado. Reintento en ${espera}s."
            sleep "$espera"
          done
          echo "::error::terraform init ha fallado tres veces."
          exit 1

      - name: Validate
        run: terraform validate
        working-directory: Deploy/infra
