name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Compilar y probar
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Instalar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar
        run: dotnet restore LegacyLens.slnx

      - name: Compilar
        run: dotnet build LegacyLens.slnx --no-restore --configuration Release

      # Los tests cubren el analizador, que es la parte determinista del
      # sistema y por tanto la única que se puede verificar con asserts.
      - name: Probar
        run: dotnet test LegacyLens.slnx --no-build --configuration Release --verbosity normal

      - name: Validar el contenedor
        run: docker build -t legacylens:ci .

      # Que la imagen se construya y responda 200 no basta: una aplicación de
      # Blazor Server a la que le falte wwwroot/_framework arranca, sirve el HTML
      # y parece correcta, pero no tiene runtime en el navegador y ningún botón
      # funciona. Pasó de verdad, por publicar con --no-restore, y tardó en
      # detectarse porque todas las comprobaciones anteriores daban verde.
      - name: Comprobar que la imagen sirve el runtime de Blazor
        run: |
          docker run -d --name humo -p 8080:8080 \
            -e 'ConnectionStrings__DefaultConnection=Server=nohay;Database=x;Encrypt=False' \
            legacylens:ci

          # Se espera a que el servidor acepte conexiones. La base de datos no
          # existe a propósito: aquí solo se comprueba que los activos estáticos
          # del framework están en la imagen.
          for intento in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:8080/_framework/blazor.web.js; then
              echo "blazor.web.js servido correctamente."
              docker rm -f humo
              exit 0
            fi
            sleep 2
          done

          echo '::error::La imagen no sirve _framework/blazor.web.js: el publish no incluyó los activos del framework.'
          docker logs humo | tail -30
          docker rm -f humo
          exit 1

  terraform:
    name: Validar infraestructura
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      - name: Comprobar formato
        run: terraform fmt -check -recursive
        working-directory: Deploy/infra

      # init sin backend: valida la sintaxis sin necesitar credenciales.
      - name: Inicializar
        run: terraform init -backend=false
        working-directory: Deploy/infra

      - name: Validar
        run: terraform validate
        working-directory: Deploy/infra
