name: Deploy

# ---------------------------------------------------------------------------
# Camino único a producción, en el orden en que las cosas pueden romperse:
#
#   1. Compilar y probar        si los tests fallan, no se toca nada
#   2. Planificar               qué cambiaría en la infraestructura
#   3. Revisar y aprobar        parada manual del entorno 'production'
#   4. Aplicar infraestructura  el plan aprobado, no uno nuevo
#   5. Actualizar la base de datos
#   6. Desplegar la web         y comprobar que responde
#
# El orden entre 5 y 6 no es negociable: el esquema tiene que estar listo antes
# de que arranque el código que lo usa. Al revés, la revisión nueva fallaría al
# consultar columnas que todavía no existen.
#
# Sustituye a los antiguos infra.yml y deploy.yml, que podían pisarse entre sí.
# ci.yml sigue validando los pull request y security.yml el análisis.
# ---------------------------------------------------------------------------

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      infrastructure_only:
        description: 'Stop after applying the infrastructure'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

env:
  RESOURCE_GROUP: rg-legacylens-tfm
  CONTAINER_APP: ca-legacylens-tfm
  IMAGE_REPOSITORY: legacy-lens

jobs:
  # -------------------------------------------------------------------------
  # 1. Compilar y probar
  # -------------------------------------------------------------------------
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore LegacyLens.slnx

      - name: Build the solution
        run: dotnet build LegacyLens.slnx --no-restore --configuration Release

      # Los tests cubren el analizador, que es la parte determinista. La parte no
      # determinista se mide con el arnés de evaluación, que no corre aquí porque
      # consume cuota del modelo en cada commit.
      - name: Run the tests
        run: dotnet test LegacyLens.slnx --no-build --configuration Release

  # -------------------------------------------------------------------------
  # 2. Planificar la infraestructura
  # -------------------------------------------------------------------------
  plan-infrastructure:
    name: Plan infrastructure
    needs: build
    runs-on: ubuntu-latest

    # Sin las variables de arranque el pipeline no puede funcionar. Se omite en
    # lugar de fallar, para no dejar un aspa roja permanente en el repositorio.
    if: >-
      vars.TFSTATE_STORAGE_ACCOUNT != ''
      && vars.AZURE_INFRA_CLIENT_ID != ''
      && vars.SQL_ADMIN_OBJECT_ID != ''

    env:
      ARM_USE_OIDC: 'true'
      ARM_CLIENT_ID: ${{ vars.AZURE_INFRA_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_ACCESS_KEY: ${{ secrets.TFSTATE_ACCESS_KEY }}
      TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_deploy_app: 'true'

      # La identidad que administra el servidor SQL. Es la misma que aplica la
      # infraestructura, porque es la que despues tiene que ejecutar las
      # migraciones: el servidor no admite usuario y contrasena, solo Entra.
      #
      # object_id es el del service principal, no el del registro de aplicacion.
      # Son distintos y usar el equivocado hace que Azure rechace el
      # administrador sin explicar por que.
      TF_VAR_sql_admin: >-
        {"login":"${{ vars.SQL_ADMIN_LOGIN }}",
         "object_id":"${{ vars.SQL_ADMIN_OBJECT_ID }}"}
      TF_IN_AUTOMATION: 'true'

    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}

    steps:
      - uses: actions/checkout@v7

      - uses: ./Deploy/actions/terraform
        with:
          storage-account: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
          container: ${{ vars.TFSTATE_CONTAINER }}
          key: ${{ vars.TFSTATE_KEY }}

      - name: Check formatting and validate
        working-directory: Deploy/infra
        run: |
          terraform fmt -check -recursive
          terraform validate

      - name: Plan
        id: plan
        working-directory: Deploy/infra
        run: |
          # Nombres de variable en ASCII: bash no admite acentos en un
          # identificador, asi que "codigo=..." con tilde no era una asignacion
          # sino un comando inexistente. El efecto era que este paso no podia
          # fallar: terraform devolvia error y el trabajo salia verde.
          set +e
          terraform plan -no-color -input=false -out=tfplan -detailed-exitcode | tee plan.txt
          exit_code=${PIPESTATUS[0]}
          set -e

          # 0 sin cambios, 2 con cambios, 1 error. Cualquier otro valor tambien
          # se trata como fallo en lugar de darlo por bueno.
          if [ "$exit_code" != '0' ] && [ "$exit_code" != '2' ]; then
            echo "::error::terraform plan fallo con codigo $exit_code."
            exit 1
          fi

          echo "has_changes=$([ "$exit_code" = '2' ] && echo si || echo no)" >> "$GITHUB_OUTPUT"

          {
            echo '### Plan de infraestructura'
            echo ''
            [ "$exit_code" = '2' ] && echo 'Hay cambios pendientes de aplicar.' || echo 'Sin cambios.'
            echo ''
            echo '<details><summary>Ver el plan</summary>'
            echo ''
            echo '```hcl'
            tail -c 50000 plan.txt
            echo '```'
            echo ''
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      # El plan se guarda para aplicar exactamente lo que se revisó, sin ventana
      # para que algo cambie entre la aprobación y el apply.
      - uses: actions/upload-artifact@v7
        with:
          name: tfplan
          path: Deploy/infra/tfplan
          retention-days: 5

  # -------------------------------------------------------------------------
  # 3 y 4. Revisar, aprobar y aplicar
  # -------------------------------------------------------------------------
  apply-infrastructure:
    name: Apply infrastructure
    needs: plan-infrastructure
    runs-on: ubuntu-latest

    # La parada de revisión: si el entorno 'production' tiene revisores
    # requeridos, GitHub espera aquí una aprobación manual antes de continuar.
    # Es el equivalente a las aprobaciones de release de Azure DevOps.
    environment: production

    env:
      ARM_USE_OIDC: 'true'
      ARM_CLIENT_ID: ${{ vars.AZURE_INFRA_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_ACCESS_KEY: ${{ secrets.TFSTATE_ACCESS_KEY }}
      TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_deploy_app: 'true'

      # La identidad que administra el servidor SQL. Es la misma que aplica la
      # infraestructura, porque es la que despues tiene que ejecutar las
      # migraciones: el servidor no admite usuario y contrasena, solo Entra.
      #
      # object_id es el del service principal, no el del registro de aplicacion.
      # Son distintos y usar el equivocado hace que Azure rechace el
      # administrador sin explicar por que.
      TF_VAR_sql_admin: >-
        {"login":"${{ vars.SQL_ADMIN_LOGIN }}",
         "object_id":"${{ vars.SQL_ADMIN_OBJECT_ID }}"}
      TF_IN_AUTOMATION: 'true'

    outputs:
      sql_server: ${{ steps.collect.outputs.sql_server }}
      sql_database: ${{ steps.collect.outputs.sql_database }}
      app_url: ${{ steps.collect.outputs.app_url }}
      registry: ${{ steps.collect.outputs.registry }}
      identity: ${{ steps.collect.outputs.identity }}
      identity_client_id: ${{ steps.collect.outputs.identity_client_id }}

    steps:
      - uses: actions/checkout@v7

      - uses: ./Deploy/actions/terraform
        with:
          storage-account: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
          container: ${{ vars.TFSTATE_CONTAINER }}
          key: ${{ vars.TFSTATE_KEY }}

      - uses: actions/download-artifact@v8
        with:
          name: tfplan
          path: Deploy/infra

      # lock-timeout espera si otro apply tiene el estado tomado, en lugar de
      # fallar al instante. Ojo con lo que NO resuelve: un lease abandonado
      # —terraform muerto a media ejecucion— es infinito y esperar no lo libera;
      # eso hay que romperlo a mano.
      - name: Apply the approved plan
        working-directory: Deploy/infra
        run: terraform apply -input=false -auto-approve -lock-timeout=5m tfplan

      - name: Collect the outputs
        id: collect
        working-directory: Deploy/infra
        run: |
          {
            echo "sql_server=$(terraform output -raw sql_server_fqdn)"
            echo "sql_database=$(terraform output -raw sql_database_name)"
            echo "app_url=$(terraform output -raw app_url)"
            echo "registry=$(terraform output -raw container_registry)"
            echo "identity=$(terraform output -raw app_identity_name)"
            echo "identity_client_id=$(terraform output -raw app_identity_client_id)"
          } >> "$GITHUB_OUTPUT"

  # -------------------------------------------------------------------------
  # 5. Actualizar la base de datos
  # -------------------------------------------------------------------------
  update-database:
    name: Update database
    needs: apply-infrastructure
    if: inputs.infrastructure_only != true
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Se autentica con la identidad de infraestructura porque es la que
      # Terraform ha dejado como administradora de Entra del servidor SQL. La
      # identidad de despliegue no puede aplicar migraciones, y es deliberado.
      - name: Sign in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_INFRA_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # El ejecutor de GitHub tiene IP pública variable, así que hay que abrirle
      # el cortafuegos justo para esta ejecución y cerrarlo después.
      - name: Open the firewall for the runner
        id: firewall
        run: |
          ip=$(curl -s --max-time 10 https://api.ipify.org)
          rule="pipeline-${{ github.run_id }}"

          echo "rule=$rule" >> "$GITHUB_OUTPUT"

          az sql server firewall-rule create \
            --resource-group "$RESOURCE_GROUP" \
            --server "$(echo '${{ needs.apply-infrastructure.outputs.sql_server }}' | cut -d. -f1)" \
            --name "$rule" \
            --start-ip-address "$ip" \
            --end-ip-address "$ip" \
            --output none

          echo "Cortafuegos abierto para $ip"

      # Version fijada a la misma que los paquetes de EF del proyecto. Sin
      # fijarla se instala la ultima estable, que hoy coincide, pero saltaria
      # sola a EF 11 en cuanto se publique.
      - name: Install the EF tool
        run: dotnet tool install --global dotnet-ef --version 10.0.11

      # Se compila aparte y la migracion se aplica con --no-build. Asi un fallo
      # de compilacion se distingue de un fallo al aplicar la migracion, en vez
      # de quedar los dos mezclados en el mismo paso.
      - name: Build the startup project
        run: dotnet build src/LegacyLens.Web --configuration Release

      # Authentication=Active Directory Default hace que el cliente pida un token
      # con la sesión de az que acabamos de abrir. Ninguna contraseña.
      - name: Apply migrations
        env:
          ConnectionStrings__DefaultConnection: >-
            Server=tcp:${{ needs.apply-infrastructure.outputs.sql_server }},1433;
            Database=${{ needs.apply-infrastructure.outputs.sql_database }};
            Authentication=Active Directory Default;Encrypt=True;Connection Timeout=60;
        run: |
          dotnet ef database update \
            --project src/LegacyLens.Persistence.EF \
            --startup-project src/LegacyLens.Web \
            --no-build --configuration Release

      # Version fijada: 'latest' haria que el pipeline cambiara de herramienta
      # sin que nadie lo decidiera.
      - name: Install sqlcmd
        run: |
          curl -fsSL \
            https://github.com/microsoft/go-sqlcmd/releases/download/v1.10.0/sqlcmd-linux-amd64.tar.bz2 \
            | tar -xj -C /usr/local/bin sqlcmd
          sqlcmd --version

      # Terraform no puede hacer esto: conceder acceso dentro de Azure SQL es
      # una operación del plano de datos. Ver el comentario del script.
      #
      # Las banderas son las de compatibilidad de go-sqlcmd, y no coinciden con
      # lo que uno esperaría: la base de datos es --database-name y las
      # variables son --variables, en plural.
      - name: Register the application identity
        env:
          SERVER: ${{ needs.apply-infrastructure.outputs.sql_server }}
          DATABASE: ${{ needs.apply-infrastructure.outputs.sql_database }}
          IDENTITY: ${{ needs.apply-infrastructure.outputs.identity }}
          IDENTITY_CLIENT_ID: ${{ needs.apply-infrastructure.outputs.identity_client_id }}
        run: |
          if ! output=$(sqlcmd \
            --server "$SERVER" \
            --database-name "$DATABASE" \
            --authentication-method ActiveDirectoryDefault \
            --variables APP_IDENTITY="$IDENTITY" \
            --variables APP_CLIENT_ID="$IDENTITY_CLIENT_ID" \
            --input-file Deploy/sql/grant-identity-access.sql \
            --exit-on-error 2>&1); then
            echo "$output"
            echo "::error::sqlcmd falló al dar de alta $IDENTITY."
            exit 1
          fi

          echo "$output"

          # sqlcmd devuelve 0 aunque no consiga conectarse: --exit-on-error solo
          # cubre errores de T-SQL, no de conexión. Sin esta comprobación el paso
          # saldría verde sin haber concedido nada, y el fallo aparecería mucho
          # más tarde, al arrancar la aplicación.
          if ! grep -q 'GRANT_CONFIRMED' <<< "$output"; then
            echo "::error::La identidad $IDENTITY no quedó dada de alta en $DATABASE."
            exit 1
          fi

          echo "Identidad $IDENTITY dada de alta con lectura y escritura."

      # En always() para que el cortafuegos se cierre también si la migración
      # falla: dejarlo abierto sería peor que el fallo original.
      - name: Close the firewall
        if: always() && steps.firewall.outputs.rule != ''
        run: |
          az sql server firewall-rule delete \
            --resource-group "$RESOURCE_GROUP" \
            --server "$(echo '${{ needs.apply-infrastructure.outputs.sql_server }}' | cut -d. -f1)" \
            --name "${{ steps.firewall.outputs.rule }}" \
            --output none || echo "La regla ya no existía."

  # -------------------------------------------------------------------------
  # 6. Desplegar la web
  # -------------------------------------------------------------------------
  deploy-web:
    name: Deploy web
    needs: [apply-infrastructure, update-database]
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v7

      - name: Sign in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # az acr build construye dentro de Azure: el ejecutor no necesita
      # credenciales del registro ni subir capas por la red, y el registro sigue
      # con las credenciales de administrador desactivadas.
      - name: Build the image in Azure
        id: image
        run: |
          registry='${{ needs.apply-infrastructure.outputs.registry }}'
          tag="${GITHUB_SHA::12}"

          az acr build \
            --registry "$(echo "$registry" | cut -d. -f1)" \
            --image "$IMAGE_REPOSITORY:$tag" \
            --image "$IMAGE_REPOSITORY:latest" \
            --file Dockerfile \
            .

          echo "reference=$registry/$IMAGE_REPOSITORY:$tag" >> "$GITHUB_OUTPUT"

      # El token del servidor MCP se escribe aquí y no en Terraform: el plan se
      # sube como artefacto de la ejecución y en un repositorio público sería
      # descargable con el valor en claro dentro.
      #
      # Va antes de publicar la revisión para que la actualización de imagen sea
      # el último cambio y no queden dos revisiones seguidas.
      - name: Set the MCP token
        id: mcp
        env:
          MCP_API_KEY: ${{ secrets.MCP_API_KEY }}
        run: |
          if [ -z "$MCP_API_KEY" ]; then
            echo "::warning::MCP_API_KEY no está configurado. El endpoint /mcp no se publicará."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${#MCP_API_KEY}" -lt 32 ]; then
            echo "::error::MCP_API_KEY tiene ${#MCP_API_KEY} caracteres y la aplicación exige 32."
            exit 1
          fi

          az containerapp secret set             --name "$CONTAINER_APP"             --resource-group "$RESOURCE_GROUP"             --secrets "mcp-api-key=$MCP_API_KEY"             --output none

          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Publish the revision
        run: |
          az containerapp update \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image '${{ steps.image.outputs.reference }}' \
            --output none

      # No basta con que az devuelva éxito: la revisión puede fallar al arrancar,
      # por ejemplo si no puede conectarse a la base de datos.
      - name: Check it responds
        run: |
          url='${{ needs.apply-infrastructure.outputs.app_url }}'

          for attempt in $(seq 1 20); do
            http_code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$url" || echo 000)

            if [ "$http_code" = '200' ]; then
              echo "La aplicación responde 200 en el intento $attempt."
              exit 0
            fi

            echo "Intento $attempt: $http_code. Esperando..."
            sleep 15
          done

          echo "::error::La aplicación no respondió 200 tras 20 intentos."
          exit 1

      # Que la portada dé 200 no dice nada del servidor MCP. Un 401 confirma que
      # el endpoint existe y que exige el token; un 404 significa que la
      # aplicación arrancó sin publicarlo, y eso se descubriría cuando alguien
      # intentara usarlo.
      - name: Check the MCP endpoint is published
        if: steps.mcp.outputs.configured == 'true'
        run: |
          url='${{ needs.apply-infrastructure.outputs.app_url }}/mcp'

          http_code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10             -X POST "$url"             -H 'Content-Type: application/json'             -H 'Accept: application/json, text/event-stream'             -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' || echo 000)

          if [ "$http_code" = '401' ]; then
            echo "El endpoint MCP está publicado y rechaza peticiones sin token."
            exit 0
          fi

          echo "::error::POST $url devolvió $http_code y se esperaba 401."
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo '### Despliegue completado'
            echo ''
            echo '| | |'
            echo '| --- | --- |'
            echo "| URL | ${{ needs.apply-infrastructure.outputs.app_url }} |"
            echo "| Imagen | \`${{ steps.image.outputs.reference }}\` |"
            echo "| Commit | \`${GITHUB_SHA::12}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
