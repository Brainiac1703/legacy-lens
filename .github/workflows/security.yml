name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Un análisis semanal detecta vulnerabilidades publicadas después del último
    # commit, que es justo el caso que un análisis por push nunca ve.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest

    permissions:
      security-events: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Install .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Initialise CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp
          queries: security-extended

      # CodeQL necesita observar una compilación real para construir su base de
      # datos, así que aquí no vale con restaurar.
      - name: Build
        run: dotnet build LegacyLens.slnx --configuration Release

      - name: Analyse
        uses: github/codeql-action/analyze@v3

  dependencies:
    name: Vulnerable dependencies
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore LegacyLens.slnx

      # Falla la ejecución si aparece cualquier paquete con vulnerabilidad
      # conocida, incluidas las transitivas. Es exactamente el aviso que hubo
      # que atender durante el desarrollo con SQLitePCLRaw.
      #
      # Se recorren los proyectos uno a uno y no la solución: docker-compose.dcproj
      # forma parte de ella para que aparezca en Visual Studio, y su SDK solo
      # existe dentro de Visual Studio. 'restore', 'build' y 'test' lo ignoran sin
      # problema, pero 'dotnet list package' intenta evaluarlo y falla.
      - name: Scan for vulnerable packages
        run: |
          : > vulnerable.txt

          for project in $(find src tests tools -name '*.csproj' | sort); do
            echo "--- $project" >> vulnerable.txt
            dotnet list "$project" package --vulnerable --include-transitive >> vulnerable.txt 2>&1
          done

          cat vulnerable.txt

          if grep -q -E "Crítica|Critical|Alta|High|Moderada|Moderate" vulnerable.txt; then
            echo "::error::Se han detectado dependencias con vulnerabilidades conocidas"
            exit 1
          fi

          echo "Sin dependencias vulnerables."

      # Los paquetes obsoletos no rompen nada hoy, pero dejan de recibir
      # correcciones de seguridad. Se avisa sin fallar.
      - name: Scan for outdated packages
        continue-on-error: true
        run: |
          for project in $(find src tests tools -name '*.csproj' | sort); do
            dotnet list "$project" package --deprecated
          done
