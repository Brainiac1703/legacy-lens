version: 2

updates:
  # Las dependencias de NuGet son la vía por la que entró la única vulnerabilidad
  # detectada durante el desarrollo: SQLitePCLRaw con un CVE conocido, que llegó
  # como dependencia transitiva de EF Core.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Los paquetes de Microsoft se versionan juntos: actualizarlos por separado
      # genera conflictos de versión sin aportar nada.
      microsoft:
        patterns:
          - 'Microsoft.*'
          - 'System.*'
      azure:
        patterns:
          - 'Azure.*'
    ignore:
      # MediatR 12.5.0 es la ultima version Apache-2.0. Desde la 13, el paquete
      # esta bajo Reciprocal Public License 1.5 -que obliga a publicar el codigo
      # de lo que construyas con ella- o licencia comercial de Lucky Penny
      # Software. Aceptar un mayor aqui cambiaria la licencia del proyecto sin
      # que nadie lo decidiera, asi que se bloquea por configuracion y no por
      # confiar en que quien revise la propuesta lo sepa. Ver ADR 0003 y 0007.
      - dependency-name: MediatR
        update-types:
          - version-update:semver-major

      # xunit.v3 4.x abandona VSTest y exige migrar a Microsoft.Testing Platform,
      # que no es un cambio de version sino una migracion del proyecto de tests:
      # hay que quitar xunit.runner.visualstudio y Microsoft.NET.Test.Sdk y
      # activar el nuevo dotnet test. Bloqueado hasta hacerla, para no tener una
      # propuesta en rojo permanente. Anotado en la hoja de ruta.
      - dependency-name: xunit.v3
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directory: /Deploy/infra
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
